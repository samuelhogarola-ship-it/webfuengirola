server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  if ($host = www.webfuengirola.com) {
    return 301 https://webfuengirola.com$request_uri;
  }

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://analytics.187.124.55.36.sslip.io https://challenges.cloudflare.com; connect-src 'self' https://analytics.187.124.55.36.sslip.io https://admin.webfuengirola.com https://challenges.cloudflare.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; frame-src https://challenges.cloudflare.com; form-action 'self' https://admin.webfuengirola.com; upgrade-insecure-requests" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), browsing-topics=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;

  location ~ /\.(?!well-known) {
    deny all;
  }

  location = /index.html {
    return 301 /;
  }

  location = /favicon.ico {
    return 302 /favicon.png;
  }

  location = /apple-touch-icon-precomposed.png {
    return 302 /apple-touch-icon.png;
  }

  location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
    expires 1y;
    try_files $uri =404;
  }

  location ~* \.(?:css|js)$ {
    expires 7d;
    try_files $uri =404;
  }

  location = /servicios.html {
    return 301 /servicios/;
  }

  location = /portfolio.html {
    return 301 /casos/;
  }

  location = /productos/lite-blog-wordpress/ {
    return 301 /servicios/#precios;
  }

  location = /productos/express-300-blog-wordpress/ {
    return 301 /servicios/#precios;
  }

  location = /productos/web-personalizada/ {
    return 301 /diseno-web-fuengirola/;
  }

  location = /productos/express-migracion-optimizacion-formularios/ {
    return 301 /diseno-web-fuengirola/;
  }

  location = /productos/personalizada-webapp/ {
    return 301 /servicios/aplicaciones-web/;
  }

  location = /productos/mini-saas-personalizado/ {
    return 301 /servicios/aplicaciones-web/;
  }

  location = /portfolio {
    return 301 /casos/;
  }

  location = /portfolio/ {
    return 301 /casos/;
  }

  location ~ ^/portfolio/([^./]+)/?$ {
    return 301 /casos/$1/;
  }

  location = /proceso.html {
    return 301 /como-trabajamos/;
  }

  location = /diseno-web-fuengirola.html {
    return 301 /servicios/diseno-web/;
  }

  location = /diseno-web-mijas.html {
    return 301 /servicios/diseno-web/;
  }

  location = /diseno-web-benalmadena.html {
    return 301 /servicios/diseno-web/;
  }

  location = /diseno-web-marbella.html {
    return 301 /servicios/diseno-web/;
  }

  location = /seo-local-fuengirola.html {
    return 301 /servicios/#seo-local;
  }

  location = /precios-diseno-web-fuengirola/ {
    return 301 /servicios/#precios;
  }

  location = /seo-local-fuengirola/ {
    return 301 /servicios/#seo-local;
  }

  location = /servicios/seo-local/ {
    return 301 /servicios/#seo-local;
  }

  location = /automatizacion-ia-fuengirola/ {
    return 301 /servicios/#automatizacion-ia;
  }

  location = /en/web-design-prices-fuengirola/ {
    return 301 /en/web-design-fuengirola/#precios;
  }

  location = /en/local-seo-fuengirola/ {
    return 301 /en/web-design-fuengirola/#seo-local;
  }

  location = /en/automation-ai-fuengirola/ {
    return 301 /en/web-design-fuengirola/#automatizacion-ia;
  }

  location = /de/webdesign-preise-fuengirola/ {
    return 301 /de/webdesign-fuengirola/#precios;
  }

  location = /de/lokales-seo-fuengirola/ {
    return 301 /de/webdesign-fuengirola/#seo-local;
  }

  location = /de/automatisierung-ki-fuengirola/ {
    return 301 /de/webdesign-fuengirola/#automatizacion-ia;
  }

  location = /fi/verkkosivujen-hinnat-fuengirola/ {
    return 301 /fi/verkkosivut-fuengirola/#precios;
  }

  location = /fi/paikallinen-seo-fuengirola/ {
    return 301 /fi/verkkosivut-fuengirola/#seo-local;
  }

  location = /fi/automaatio-tekoaly-fuengirola/ {
    return 301 /fi/verkkosivut-fuengirola/#automatizacion-ia;
  }

  location = /servicios/automatizacion/ {
    return 301 /servicios/#automatizacion-ia;
  }

  location ~ ^/recursos/?$ {
    return 301 /servicios/;
  }

  location ~ ^/recursos/herramientas/?$ {
    return 301 /servicios/#precios;
  }

  location ~ ^/recursos/guias/?$ {
    return 301 /blog/;
  }

  location ~ ^/recursos/checklists/?$ {
    return 301 /auditoria-web-gratis/;
  }

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }
}
